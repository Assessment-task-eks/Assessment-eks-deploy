apiVersion: apps/v1
kind: Deployment

metadata:
  name: bank-api

spec:

  replicas: 2

  selector:
    matchLabels:
      app: bank-api


  template:

    metadata:
      labels:
        app: bank-api


    spec:

      affinity:

        nodeAffinity:

          requiredDuringSchedulingIgnoredDuringExecution:

            nodeSelectorTerms:

            - matchExpressions:

              - key: workload

                operator: In

                values:
                - bank


      containers:

      - name: bank-api

        image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/bank-api:latest

        ports:

        - containerPort: 8080


        readinessProbe:

          httpGet:

            path: /health

            port: 8080

          initialDelaySeconds: 10

          periodSeconds: 5


        livenessProbe:

          httpGet:

            path: /health

            port: 8080

          initialDelaySeconds: 20

          periodSeconds: 10
