apiVersion: apps/v1

kind: Deployment


metadata:

  name: upi-api


spec:

  replicas: 2


  selector:

    matchLabels:

      app: upi-api



  template:


    metadata:

      labels:

        app: upi-api



    spec:


      affinity:


        nodeAffinity:


          requiredDuringSchedulingIgnoredDuringExecution:


            nodeSelectorTerms:


            - matchExpressions:


              - key: workload

                operator: In

                values:

                - upi

        podAntiAffinity:

          preferredDuringSchedulingIgnoredDuringExecution:

          - weight: 100

            podAffinityTerm:

              labelSelector:

                matchExpressions:

                - key: app

                  operator: In

                  values:
                  - upi-api

              topologyKey: kubernetes.io/hostname



      containers:


      - name: upi-api


        image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/upi-api:latest


        ports:


        - containerPort: 8080



        readinessProbe:


          httpGet:


            path: /health


            port: 8080



        livenessProbe:


          httpGet:


            path: /health


            port: 8080
