name: Terraform + Deploy APIs to EKS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: assessment-eks

  BANK_API_IMAGE: bank-api
  UPI_API_IMAGE: upi-api

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. DETECT CHANGES
  # ============================================================

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      application: ${{ steps.filter.outputs.application }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed files
        id: filter
        shell: bash
        run: |
          echo "Checking changed files..."

          if git diff --name-only HEAD^ HEAD | grep -q '^terraform/'; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"
            echo "Terraform changes detected."
          else
            echo "terraform=false" >> "$GITHUB_OUTPUT"
            echo "No Terraform changes."
          fi

          if git diff --name-only HEAD^ HEAD | grep -Eq '^(apps/|kubernetes/)'; then
            echo "application=true" >> "$GITHUB_OUTPUT"
            echo "Application/Kubernetes changes detected."
          else
            echo "application=false" >> "$GITHUB_OUTPUT"
            echo "No application/Kubernetes changes."
          fi


  # ============================================================
  # 2. TERRAFORM
  # ============================================================

  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest

    needs: changes

    if: needs.changes.outputs.terraform == 'true'

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Version
        run: |
          terraform version

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init

      - name: Terraform Format
        working-directory: terraform
        run: |
          terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate

      # ----------------------------------------------------------
      # Import existing EKS admin access entry if necessary
      # ----------------------------------------------------------

      - name: Import EKS Admin Access Entry
        working-directory: terraform
        shell: bash
        run: |
          set +e

          echo "========================================="
          echo "CHECKING EKS ADMIN ACCESS ENTRY"
          echo "========================================="

          ACCESS_ENTRY_ARN="arn:aws:iam::033142159665:user/iac"

          if terraform state list 2>/dev/null | grep -q \
            '^module.eks.aws_eks_access_entry.admin$'; then

            echo "Admin access entry already exists in Terraform state."

          else

            echo "Checking whether EKS cluster exists..."

            CLUSTER_EXISTS=$(aws eks describe-cluster \
              --region "$AWS_REGION" \
              --name "$CLUSTER_NAME" \
              --query 'cluster.name' \
              --output text 2>/dev/null)

            if [ "$CLUSTER_EXISTS" = "$CLUSTER_NAME" ]; then

              echo "EKS cluster exists."

              EXISTING_ENTRY=$(aws eks list-access-entries \
                --region "$AWS_REGION" \
                --cluster-name "$CLUSTER_NAME" \
                --query "accessEntries[?@=='$ACCESS_ENTRY_ARN'] | [0]" \
                --output text 2>/dev/null)

              if [ "$EXISTING_ENTRY" = "$ACCESS_ENTRY_ARN" ]; then

                echo "Existing access entry found."
                echo "Importing access entry..."

                terraform import \
                  'module.eks.aws_eks_access_entry.admin' \
                  "$CLUSTER_NAME:$ACCESS_ENTRY_ARN"

              else

                echo "Access entry does not exist."
                echo "Terraform will create it."

              fi

            else

              echo "EKS cluster does not exist."
              echo "Terraform will create it."

            fi
          fi

          set -e

      # ----------------------------------------------------------
      # Import existing node groups if they exist
      # ----------------------------------------------------------

      - name: Import existing EKS Node Groups
        working-directory: terraform
        shell: bash
        run: |
          set +e

          echo "========================================="
          echo "CHECKING EKS NODE GROUPS"
          echo "========================================="

          # -------------------------------
          # BANK NODE GROUP
          # -------------------------------

          if terraform state list 2>/dev/null | grep -q \
            '^module.nodegroups.aws_eks_node_group.bank$'; then

            echo "bank-workers already managed by Terraform."

          else

            BANK_NODEGROUP=$(aws eks list-nodegroups \
              --cluster-name "$CLUSTER_NAME" \
              --region "$AWS_REGION" \
              --query "nodegroups[?@=='bank-workers'] | [0]" \
              --output text 2>/dev/null)

            if [ "$BANK_NODEGROUP" = "bank-workers" ]; then

              echo "Importing bank-workers..."

              terraform import \
                'module.nodegroups.aws_eks_node_group.bank' \
                "$CLUSTER_NAME:bank-workers"

            else

              echo "bank-workers does not exist."

            fi
          fi


          # -------------------------------
          # UPI NODE GROUP
          # -------------------------------

          if terraform state list 2>/dev/null | grep -q \
            '^module.nodegroups.aws_eks_node_group.upi$'; then

            echo "upi-workers already managed by Terraform."

          else

            UPI_NODEGROUP=$(aws eks list-nodegroups \
              --cluster-name "$CLUSTER_NAME" \
              --region "$AWS_REGION" \
              --query "nodegroups[?@=='upi-workers'] | [0]" \
              --output text 2>/dev/null)

            if [ "$UPI_NODEGROUP" = "upi-workers" ]; then

              echo "Importing upi-workers..."

              terraform import \
                'module.nodegroups.aws_eks_node_group.upi' \
                "$CLUSTER_NAME:upi-workers"

            else

              echo "upi-workers does not exist."

            fi
          fi

          set -e

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve


  # ============================================================
  # 3. DEPLOY APPLICATION
  # ============================================================

  deploy:
    name: Build and Deploy APIs
    runs-on: ubuntu-latest

    needs:
      - changes
      - terraform

    # Run when:
    # 1. Application changed
    # OR
    # 2. Terraform changed and infrastructure job completed
    #
    # If Terraform did not change, the skipped terraform job
    # should not prevent application deployment.

    if: |
      always() &&
      (
        needs.changes.outputs.application == 'true' ||
        needs.changes.outputs.terraform == 'true'
      ) &&
      (
        needs.terraform.result == 'success' ||
        needs.terraform.result == 'skipped'
      )

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # AWS LOGIN
      # ==========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS
        run: |
          aws sts get-caller-identity

      # ==========================================================
      # VERIFY EKS CLUSTER
      # ==========================================================

      - name: Check EKS Cluster
        run: |
          aws eks describe-cluster \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME" \
            --query 'cluster.status' \
            --output text

      # ==========================================================
      # ECR LOGIN
      # ==========================================================

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ==========================================================
      # ACCOUNT ID
      # ==========================================================

      - name: Get AWS Account ID
        run: |
          echo "ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)" >> "$GITHUB_ENV"

      # ==========================================================
      # BUILD BANK API
      # ==========================================================

      - name: Build Bank API Image
        run: |
          docker build \
            -t "$BANK_API_IMAGE:${{ github.sha }}" \
            ./apps/bank-api

      # ==========================================================
      # BUILD UPI API
      # ==========================================================

      - name: Build UPI API Image
        run: |
          docker build \
            -t "$UPI_API_IMAGE:${{ github.sha }}" \
            ./apps/upi-api

      # ==========================================================
      # PUSH BANK API
      # ==========================================================

      - name: Push Bank API Image
        run: |

          BANK_ECR="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BANK_API_IMAGE"

          docker tag \
            "$BANK_API_IMAGE:${{ github.sha }}" \
            "$BANK_ECR:${{ github.sha }}"

          docker push \
            "$BANK_ECR:${{ github.sha }}"

      # ==========================================================
      # PUSH UPI API
      # ==========================================================

      - name: Push UPI API Image
        run: |

          UPI_ECR="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$UPI_API_IMAGE"

          docker tag \
            "$UPI_API_IMAGE:${{ github.sha }}" \
            "$UPI_ECR:${{ github.sha }}"

          docker push \
            "$UPI_ECR:${{ github.sha }}"

      # ==========================================================
      # UPDATE KUBECONFIG
      # ==========================================================

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME"

      # ==========================================================
      # VERIFY KUBERNETES
      # ==========================================================

      - name: Verify Kubernetes Connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      # ==========================================================
      # APPLY BANK API
      # ==========================================================

      - name: Apply Bank API
        run: |
          kubectl apply -f kubernetes/bank-api/

      # ==========================================================
      # APPLY UPI API
      # ==========================================================

      - name: Apply UPI API
        run: |
          kubectl apply -f kubernetes/upi-api/

      # ==========================================================
      # UPDATE BANK IMAGE
      # ==========================================================

      - name: Update Bank API Image
        run: |

          kubectl set image deployment/bank-api \
            bank-api="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BANK_API_IMAGE:${{ github.sha }}"

      # ==========================================================
      # UPDATE UPI IMAGE
      # ==========================================================

      - name: Update UPI API Image
        run: |

          kubectl set image deployment/upi-api \
            upi-api="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$UPI_API_IMAGE:${{ github.sha }}"

      # ==========================================================
      # WAIT BANK API
      # ==========================================================

      - name: Wait for Bank API
        run: |
          kubectl rollout status \
            deployment/bank-api \
            --timeout=180s

      # ==========================================================
      # WAIT UPI API
      # ==========================================================

      - name: Wait for UPI API
        run: |
          kubectl rollout status \
            deployment/upi-api \
            --timeout=180s

      # ==========================================================
      # VERIFY PODS
      # ==========================================================

      - name: Check Pods
        run: |
          echo "========================================="
          echo "PODS"
          echo "========================================="

          kubectl get pods -o wide

          echo "========================================="
          echo "SERVICES"
          echo "========================================="

          kubectl get services

          echo "========================================="
          echo "DEPLOYMENTS"
          echo "========================================="

          kubectl get deployments

      # ==========================================================
      # SHOW APPLICATION ENDPOINTS
      # ==========================================================

      - name: Show LoadBalancer URLs
        run: |

          echo "========================================="
          echo "APPLICATION ENDPOINTS"
          echo "========================================="

          kubectl get svc bank-api-service \
            -o wide || true

          kubectl get svc upi-api-service \
            -o wide || true
