name: DESTROY EKS INFRASTRUCTURE

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to confirm deletion of all infrastructure"
        required: true
        type: string

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: assessment-eks

  BANK_API_IMAGE: bank-api
  UPI_API_IMAGE: upi-api

jobs:

  destroy:

    name: Destroy AWS Infrastructure

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CONFIRM DESTROY
      # ============================================================

      - name: Confirm Destroy
        shell: bash
        run: |

          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then

            echo "ERROR: Destruction was not confirmed."

            echo "Please enter exactly:"
            echo "DESTROY"

            exit 1

          fi

          echo "========================================"
          echo "DESTROY CONFIRMED"
          echo "========================================"

          echo "Cluster:"
          echo "$CLUSTER_NAME"

          echo "Region:"
          echo "$AWS_REGION"


      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Code
        uses: actions/checkout@v4

        with:
          fetch-depth: 2


      # ============================================================
      # AWS CREDENTIALS
      # ============================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ============================================================
      # VERIFY AWS LOGIN
      # ============================================================

      - name: Verify AWS Login
        shell: bash
        run: |

          echo "========================================"
          echo "AWS ACCOUNT"
          echo "========================================"

          aws sts get-caller-identity

          echo "========================================"
          echo "AWS REGION"
          echo "========================================"

          echo "$AWS_REGION"


      # ============================================================
      # SETUP TERRAFORM
      # ============================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ============================================================
      # TERRAFORM VERSION
      # ============================================================

      - name: Terraform Version
        run: |

          terraform version


      # ============================================================
      # TERRAFORM INIT
      # ============================================================

      - name: Terraform Init
        working-directory: terraform
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "TERRAFORM INIT"
          echo "========================================"

          terraform init \
            -input=false \
            -reconfigure

          echo "Terraform initialized successfully."


      # ============================================================
      # SHOW CURRENT STATE
      # ============================================================

      - name: Show Terraform State
        working-directory: terraform
        shell: bash
        run: |

          echo "========================================"
          echo "CURRENT TERRAFORM STATE"
          echo "========================================"

          if terraform state list > /tmp/terraform-state.txt 2>/dev/null; then

            cat /tmp/terraform-state.txt

          else

            echo "No Terraform state found."

            touch /tmp/terraform-state.txt

          fi


      # ============================================================
      # IMPORT EXISTING BANK NODE GROUP
      # ============================================================

      - name: Import Existing Bank Node Group
        working-directory: terraform
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "CHECKING BANK NODE GROUP"
          echo "========================================"

          terraform state list > /tmp/state-bank.txt 2>/dev/null || true

          if grep -Fxq \
            "module.nodegroups.aws_eks_node_group.bank" \
            /tmp/state-bank.txt; then

            echo "bank-workers already exists in Terraform state."

          else

            echo "Checking AWS..."

            if aws eks describe-nodegroup \
              --cluster-name "$CLUSTER_NAME" \
              --nodegroup-name "bank-workers" \
              --region "$AWS_REGION" \
              >/dev/null 2>&1; then

              echo "bank-workers exists in AWS."

              echo "Importing bank-workers..."

              terraform import \
                "module.nodegroups.aws_eks_node_group.bank" \
                "$CLUSTER_NAME:bank-workers"

            else

              echo "bank-workers does not exist."

            fi

          fi


      # ============================================================
      # IMPORT EXISTING UPI NODE GROUP
      # ============================================================

      - name: Import Existing UPI Node Group
        working-directory: terraform
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "CHECKING UPI NODE GROUP"
          echo "========================================"

          terraform state list > /tmp/state-upi.txt 2>/dev/null || true

          if grep -Fxq \
            "module.nodegroups.aws_eks_node_group.upi" \
            /tmp/state-upi.txt; then

            echo "upi-workers already exists in Terraform state."

          else

            echo "Checking AWS..."

            if aws eks describe-nodegroup \
              --cluster-name "$CLUSTER_NAME" \
              --nodegroup-name "upi-workers" \
              --region "$AWS_REGION" \
              >/dev/null 2>&1; then

              echo "upi-workers exists in AWS."

              echo "Importing upi-workers..."

              terraform import \
                "module.nodegroups.aws_eks_node_group.upi" \
                "$CLUSTER_NAME:upi-workers"

            else

              echo "upi-workers does not exist."

            fi

          fi


      # ============================================================
      # IMPORT EKS ADMIN ACCESS ENTRY
      # ============================================================

      - name: Import EKS Admin Access Entry
        working-directory: terraform
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "CHECKING EKS ADMIN ACCESS ENTRY"
          echo "========================================"

          terraform state list > /tmp/state-access.txt 2>/dev/null || true

          if grep -Fxq \
            "module.eks.aws_eks_access_entry.admin" \
            /tmp/state-access.txt; then

            echo "Admin access entry already exists in Terraform state."

          else

            echo "Checking EKS cluster..."

            if aws eks describe-cluster \
              --name "$CLUSTER_NAME" \
              --region "$AWS_REGION" \
              >/dev/null 2>&1; then

              echo "EKS cluster exists."

              ACCOUNT_ID=$(aws sts get-caller-identity \
                --query Account \
                --output text)

              ADMIN_ARN="arn:aws:iam::${ACCOUNT_ID}:user/iac"

              echo "AWS access entry:"
              echo "$ADMIN_ARN"

              if aws eks describe-access-entry \
                --cluster-name "$CLUSTER_NAME" \
                --principal-arn "$ADMIN_ARN" \
                --region "$AWS_REGION" \
                >/dev/null 2>&1; then

                echo "Existing access entry found."

                echo "Importing access entry..."

                terraform import \
                  "module.eks.aws_eks_access_entry.admin" \
                  "$CLUSTER_NAME:$ADMIN_ARN"

              else

                echo "Access entry does not exist."

              fi

            else

              echo "EKS cluster does not exist."

            fi

          fi


      # ============================================================
      # SHOW STATE AFTER IMPORTS
      # ============================================================

      - name: Show Final Terraform State
        working-directory: terraform
        shell: bash
        run: |

          echo "========================================"
          echo "TERRAFORM STATE BEFORE DESTROY"
          echo "========================================"

          terraform state list || true


      # ============================================================
      # DELETE ECR IMAGES
      #
      # This prevents ECR repository deletion from failing because
      # repositories still contain Docker images.
      # ============================================================

      - name: Delete ECR Images
        shell: bash
        run: |

          set +e

          echo "========================================"
          echo "DELETING ECR IMAGES"
          echo "========================================"

          for REPO in "$BANK_API_IMAGE" "$UPI_API_IMAGE"
          do

            echo "Checking ECR repository: $REPO"

            aws ecr describe-repositories \
              --repository-names "$REPO" \
              --region "$AWS_REGION" \
              >/dev/null 2>&1

            if [ $? -eq 0 ]; then

              echo "Deleting images from $REPO..."

              aws ecr list-images \
                --repository-name "$REPO" \
                --region "$AWS_REGION" \
                --query 'imageIds[*]' \
                --output json > "/tmp/${REPO}-images.json"

              if [ "$(cat /tmp/${REPO}-images.json)" != "[]" ]; then

                aws ecr batch-delete-image \
                  --repository-name "$REPO" \
                  --region "$AWS_REGION" \
                  --image-ids file:///tmp/${REPO}-images.json

              else

                echo "No images found in $REPO."

              fi

            else

              echo "$REPO does not exist."

            fi

          done


      # ============================================================
      # TERRAFORM VALIDATE
      # ============================================================

      - name: Terraform Validate
        working-directory: terraform
        shell: bash
        run: |

          terraform validate


      # ============================================================
      # TERRAFORM DESTROY
      # ============================================================

      - name: Terraform Destroy
        working-directory: terraform
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "DESTROYING TERRAFORM INFRASTRUCTURE"
          echo "========================================"

          terraform destroy \
            -input=false \
            -auto-approve


      # ============================================================
      # VERIFY EKS CLUSTER DELETED
      # ============================================================

      - name: Verify EKS Cluster Deleted
        shell: bash
        run: |

          echo "========================================"
          echo "VERIFYING EKS CLUSTER"
          echo "========================================"

          if aws eks describe-cluster \
            --name "$CLUSTER_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo "ERROR: EKS cluster still exists."

            exit 1

          else

            echo "EKS cluster successfully deleted."

          fi


      # ============================================================
      # VERIFY NODE GROUPS
      # ============================================================

      - name: Verify Node Groups Deleted
        shell: bash
        run: |

          echo "========================================"
          echo "VERIFYING NODE GROUPS"
          echo "========================================"

          NODEGROUPS=$(aws eks list-nodegroups \
            --cluster-name "$CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'nodegroups' \
            --output text 2>/dev/null || true)

          if [ -z "$NODEGROUPS" ]; then

            echo "Node groups deleted."

          else

            echo "Remaining node groups:"
            echo "$NODEGROUPS"

          fi


      # ============================================================
      # VERIFY ECR
      # ============================================================

      - name: Verify ECR Repositories
        shell: bash
        run: |

          set +e

          echo "========================================"
          echo "VERIFYING ECR"
          echo "========================================"

          for REPO in "$BANK_API_IMAGE" "$UPI_API_IMAGE"
          do

            if aws ecr describe-repositories \
              --repository-names "$REPO" \
              --region "$AWS_REGION" \
              >/dev/null 2>&1; then

              echo "WARNING: ECR repository still exists: $REPO"

            else

              echo "ECR repository deleted: $REPO"

            fi

          done


      # ============================================================
      # FINAL TERRAFORM STATE
      # ============================================================

      - name: Final Terraform State
        working-directory: terraform
        shell: bash
        run: |

          echo "========================================"
          echo "FINAL TERRAFORM STATE"
          echo "========================================"

          terraform state list || true

          echo "========================================"
          echo "DESTROY COMPLETED"
          echo "========================================"