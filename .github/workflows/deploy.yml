name: Destroy AWS EKS Infrastructure

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: assessment-eks

permissions:
  contents: read

jobs:

  destroy:
    name: Destroy EKS and AWS Infrastructure
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # AWS CREDENTIALS
      # =========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # =========================================================
      # VERIFY AWS
      # =========================================================

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # =========================================================
      # INSTALL TERRAFORM
      # =========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # =========================================================
      # TERRAFORM VERSION
      # =========================================================

      - name: Check Terraform
        run: |
          terraform version


      # =========================================================
      # TERRAFORM INIT
      # =========================================================

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -input=false


      # =========================================================
      # CHECK TERRAFORM STATE
      # =========================================================

      - name: Show Terraform state
        working-directory: terraform
        run: |
          echo "========================================"
          echo "TERRAFORM STATE"
          echo "========================================"

          terraform state list || true


      # =========================================================
      # CHECK WHETHER EKS EXISTS
      # =========================================================

      - name: Check EKS cluster
        id: eks_check
        run: |
          echo "========================================"
          echo "CHECKING EKS CLUSTER"
          echo "========================================"

          if aws eks describe-cluster \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME" \
            >/dev/null 2>&1; then

            echo "EKS cluster exists."

            echo "exists=true" >> "$GITHUB_OUTPUT"

          else

            echo "EKS cluster does not exist."

            echo "exists=false" >> "$GITHUB_OUTPUT"

          fi


      # =========================================================
      # INSTALL KUBECTL
      # =========================================================

      - name: Install kubectl
        if: steps.eks_check.outputs.exists == 'true'
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"

          chmod +x kubectl

          sudo mv kubectl /usr/local/bin/kubectl

          kubectl version --client


      # =========================================================
      # UPDATE KUBECONFIG
      # =========================================================

      - name: Update kubeconfig
        if: steps.eks_check.outputs.exists == 'true'
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME"


      # =========================================================
      # CHECK KUBERNETES CONNECTION
      # =========================================================

      - name: Check Kubernetes cluster
        if: steps.eks_check.outputs.exists == 'true'
        run: |
          echo "========================================"
          echo "CHECKING KUBERNETES"
          echo "========================================"

          kubectl get nodes || true

          kubectl get pods -A || true


      # =========================================================
      # DELETE KUBERNETES APPLICATIONS
      # =========================================================

      - name: Delete Kubernetes applications
        if: steps.eks_check.outputs.exists == 'true'
        run: |
          echo "========================================"
          echo "DELETING KUBERNETES APPLICATIONS"
          echo "========================================"

          if [ -d "kubernetes/bank-api" ]; then
            kubectl delete -f kubernetes/bank-api/ \
              --ignore-not-found=true \
              --wait=true || true
          fi

          if [ -d "kubernetes/upi-api" ]; then
            kubectl delete -f kubernetes/upi-api/ \
              --ignore-not-found=true \
              --wait=true || true
          fi


      # =========================================================
      # DELETE LOAD BALANCERS / SERVICES
      # =========================================================

      - name: Delete application services
        if: steps.eks_check.outputs.exists == 'true'
        run: |
          echo "========================================"
          echo "DELETING APPLICATION SERVICES"
          echo "========================================"

          kubectl delete service bank-api-service \
            --ignore-not-found=true || true

          kubectl delete service upi-api-service \
            --ignore-not-found=true || true

          echo "Waiting for AWS Load Balancers to be removed..."

          sleep 30


      # =========================================================
      # SHOW REMAINING KUBERNETES RESOURCES
      # =========================================================

      - name: Check remaining Kubernetes resources
        if: steps.eks_check.outputs.exists == 'true'
        run: |
          echo "========================================"
          echo "REMAINING KUBERNETES RESOURCES"
          echo "========================================"

          kubectl get pods -A || true
          kubectl get svc -A || true
          kubectl get deployments -A || true


      # =========================================================
      # CHECK NODE GROUPS
      # =========================================================

      - name: Check EKS node groups
        if: steps.eks_check.outputs.exists == 'true'
        run: |
          echo "========================================"
          echo "EKS NODE GROUPS"
          echo "========================================"

          aws eks list-nodegroups \
            --cluster-name "$CLUSTER_NAME" \
            --region "$AWS_REGION" \
            || true


      # =========================================================
      # TERRAFORM PLAN DESTROY
      # =========================================================

      - name: Terraform Destroy Plan
        working-directory: terraform
        run: |
          echo "========================================"
          echo "TERRAFORM DESTROY PLAN"
          echo "========================================"

          terraform plan -destroy


      # =========================================================
      # TERRAFORM DESTROY
      # =========================================================

      - name: Terraform Destroy
        working-directory: terraform
        run: |
          echo "========================================"
          echo "TERRAFORM DESTROY"
          echo "========================================"

          terraform destroy \
            -auto-approve \
            -input=false


      # =========================================================
      # CHECK WHETHER EKS STILL EXISTS
      # =========================================================

      - name: Check EKS after Terraform destroy
        id: eks_after_terraform
        run: |
          echo "========================================"
          echo "CHECKING EKS AFTER TERRAFORM"
          echo "========================================"

          if aws eks describe-cluster \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME" \
            >/dev/null 2>&1; then

            echo "EKS cluster STILL EXISTS."

            echo "exists=true" >> "$GITHUB_OUTPUT"

          else

            echo "EKS cluster has been deleted."

            echo "exists=false" >> "$GITHUB_OUTPUT"

          fi


      # =========================================================
      # DELETE EKS IF TERRAFORM DID NOT DELETE IT
      # =========================================================

      - name: Delete EKS cluster if still present
        if: steps.eks_after_terraform.outputs.exists == 'true'
        run: |
          echo "========================================"
          echo "MANUAL EKS CLUSTER DELETE"
          echo "========================================"

          aws eks delete-cluster \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME"


      # =========================================================
      # WAIT FOR EKS DELETE
      # =========================================================

      - name: Wait for EKS cluster deletion
        run: |
          echo "========================================"
          echo "WAITING FOR EKS DELETION"
          echo "========================================"

          for i in {1..30}; do

            if aws eks describe-cluster \
              --region "$AWS_REGION" \
              --name "$CLUSTER_NAME" \
              >/dev/null 2>&1; then

              echo "EKS cluster still exists..."
              sleep 20

            else

              echo "EKS cluster no longer exists."
              break

            fi

          done


      # =========================================================
      # FINAL CHECK
      # =========================================================

      - name: Final AWS verification
        run: |
          echo "========================================"
          echo "FINAL VERIFICATION"
          echo "========================================"

          echo ""
          echo "EKS clusters:"
          aws eks list-clusters \
            --region "$AWS_REGION" || true

          echo ""
          echo "Terraform state:"
          cd terraform

          terraform state list || true

          echo ""
          echo "========================================"
          echo "DESTROY PROCESS COMPLETED"
          echo "========================================"
