name: Deploy APIs to EKS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read


env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: assessment-eks

  BANK_API_IMAGE: bank-api
  UPI_API_IMAGE: upi-api


jobs:

  build-and-deploy:

    name: Build Docker Images and Deploy
    runs-on: ubuntu-latest


    steps:

    # Checkout repository
    - name: Checkout code
      uses: actions/checkout@v4



    # Configure AWS
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:

        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        aws-region: ${{ env.AWS_REGION }}



    # Login to ECR
    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2



    # Build Bank API
    - name: Build Bank API Image
      run: |

        docker build \
        -t ${{ env.BANK_API_IMAGE }} \
        ./apps/bank-api



    # Build UPI API
    - name: Build UPI API Image
      run: |

        docker build \
        -t ${{ env.UPI_API_IMAGE }} \
        ./apps/upi-api



    # Get AWS account ID
    - name: Set ECR variables
      run: |

        echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV



    # Push Bank API
    - name: Push Bank API Image
      run: |

        docker tag \
        ${{ env.BANK_API_IMAGE }}:latest \
        $ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${{ env.BANK_API_IMAGE }}:latest


        docker push \
        $ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${{ env.BANK_API_IMAGE }}:latest



    # Push UPI API
    - name: Push UPI API Image
      run: |

        docker tag \
        ${{ env.UPI_API_IMAGE }}:latest \
        $ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${{ env.UPI_API_IMAGE }}:latest


        docker push \
        $ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${{ env.UPI_API_IMAGE }}:latest



    # Configure Kubernetes
    - name: Update kubeconfig
      run: |

        aws eks update-kubeconfig \
        --region $AWS_REGION \
        --name $CLUSTER_NAME



    # Deploy Bank API
    - name: Deploy Bank API
      run: |

        kubectl apply -f kubernetes/bank-api/



    # Deploy UPI API
    - name: Deploy UPI API
      run: |

        kubectl apply -f kubernetes/upi-api/



    # Verify deployment
    - name: Check deployment status
      run: |

        kubectl get pods -A
