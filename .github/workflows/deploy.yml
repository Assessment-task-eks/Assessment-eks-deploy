name: Terraform + Deploy APIs to EKS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: assessment-eks

  BANK_API_IMAGE: bank-api
  UPI_API_IMAGE: upi-api

permissions:
  contents: read

jobs:

  # =========================================================
  # Terraform Infrastructure
  # =========================================================

  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------
      # Checkout
      # -----------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # Configure AWS
      # -----------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # -----------------------------------------------------
      # Verify AWS
      # -----------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # -----------------------------------------------------
      # Setup Terraform
      # -----------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # -----------------------------------------------------
      # Terraform Format
      # -----------------------------------------------------

      - name: Terraform Format
        working-directory: terraform
        run: |
          terraform fmt -check -recursive


      # -----------------------------------------------------
      # Terraform Init
      # -----------------------------------------------------

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -input=false


      # -----------------------------------------------------
      # Terraform Validate
      # -----------------------------------------------------

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate


      # -----------------------------------------------------
      # Terraform Plan
      # -----------------------------------------------------

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan -input=false


      # -----------------------------------------------------
      # Terraform Apply
      # -----------------------------------------------------

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve -input=false


      # -----------------------------------------------------
      # Verify EKS Cluster
      # -----------------------------------------------------

      - name: Verify EKS cluster
        run: |
          aws eks describe-cluster \
            --name "$CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query "cluster.status" \
            --output text


  # =========================================================
  # Build Docker Images + Deploy to EKS
  # =========================================================

  deploy:
    name: Build Images and Deploy to EKS
    runs-on: ubuntu-latest

    needs:
      - terraform

    steps:

      # -----------------------------------------------------
      # Checkout
      # -----------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # Configure AWS
      # -----------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # -----------------------------------------------------
      # Verify AWS
      # -----------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # -----------------------------------------------------
      # Get AWS Account ID
      # -----------------------------------------------------

      - name: Get AWS Account ID
        run: |
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"


      # -----------------------------------------------------
      # Login to ECR
      # -----------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # =====================================================
      # Build Docker Images
      # =====================================================

      - name: Build Bank API image
        run: |
          docker build \
            -t "$BANK_API_IMAGE:${{ github.sha }}" \
            ./apps/bank-api


      - name: Build UPI API image
        run: |
          docker build \
            -t "$UPI_API_IMAGE:${{ github.sha }}" \
            ./apps/upi-api


      # =====================================================
      # Tag Docker Images
      # =====================================================

      - name: Tag Bank API image
        run: |
          docker tag \
            "$BANK_API_IMAGE:${{ github.sha }}" \
            "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BANK_API_IMAGE:${{ github.sha }}"


      - name: Tag UPI API image
        run: |
          docker tag \
            "$UPI_API_IMAGE:${{ github.sha }}" \
            "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$UPI_API_IMAGE:${{ github.sha }}"


      # =====================================================
      # Push Images to ECR
      # =====================================================

      - name: Push Bank API image
        run: |
          docker push \
            "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BANK_API_IMAGE:${{ github.sha }}"


      - name: Push UPI API image
        run: |
          docker push \
            "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$UPI_API_IMAGE:${{ github.sha }}"


      # =====================================================
      # Configure Kubernetes
      # =====================================================

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME"


      # =====================================================
      # Verify Kubernetes Access
      # =====================================================

      - name: Verify Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes


      # =====================================================
      # Create/Update Kubernetes Namespace
      # =====================================================

      - name: Apply namespaces
        run: |
          kubectl apply -f kubernetes/bank-api/
          kubectl apply -f kubernetes/upi-api/


      # =====================================================
      # Update Bank API Image
      # =====================================================

      - name: Update Bank API image
        run: |
          kubectl set image deployment/bank-api \
            bank-api="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BANK_API_IMAGE:${{ github.sha }}"


      # =====================================================
      # Update UPI API Image
      # =====================================================

      - name: Update UPI API image
        run: |
          kubectl set image deployment/upi-api \
            upi-api="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$UPI_API_IMAGE:${{ github.sha }}"


      # =====================================================
      # Wait for Bank API
      # =====================================================

      - name: Wait for Bank API rollout
        run: |
          kubectl rollout status \
            deployment/bank-api \
            --timeout=180s


      # =====================================================
      # Wait for UPI API
      # =====================================================

      - name: Wait for UPI API rollout
        run: |
          kubectl rollout status \
            deployment/upi-api \
            --timeout=180s


      # =====================================================
      # Verify Deployments
      # =====================================================

      - name: Verify deployments
        run: |
          echo "======================================"
          echo "Deployments"
          echo "======================================"

          kubectl get deployments

          echo "======================================"
          echo "Pods"
          echo "======================================"

          kubectl get pods -A

          echo "======================================"
          echo "Services"
          echo "======================================"

          kubectl get services -A


      # =====================================================
      # Final Verification
      # =====================================================

      - name: Verify Bank API
        run: |
          kubectl get deployment bank-api
          kubectl get pods -l app=bank-api


      - name: Verify UPI API
        run: |
          kubectl get deployment upi-api
          kubectl get pods -l app=upi-api