name: Terraform + Deploy APIs to EKS

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: assessment-eks

  BANK_API_IMAGE: bank-api
  UPI_API_IMAGE: upi-api

permissions:
  contents: read


# ============================================================
# TERRAFORM INFRASTRUCTURE
# ============================================================

jobs:

  terraform:

    name: Terraform Infrastructure

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout Code
        uses: actions/checkout@v4

        with:
          fetch-depth: 2


      # ========================================================
      # AWS CREDENTIALS
      # ========================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ========================================================
      # VERIFY AWS
      # ========================================================

      - name: Verify AWS Login
        run: |
          aws sts get-caller-identity

          echo "AWS Region:"
          echo "$AWS_REGION"

          echo "EKS Cluster:"
          echo "$CLUSTER_NAME"


      # ========================================================
      # GET AWS PRINCIPAL
      # ========================================================

      - name: Get AWS Account and Principal
        shell: bash
        run: |

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          PRINCIPAL_ARN=$(aws sts get-caller-identity \
            --query Arn \
            --output text)

          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "PRINCIPAL_ARN=$PRINCIPAL_ARN" >> "$GITHUB_ENV"

          echo "========================================"
          echo "AWS ACCOUNT"
          echo "$ACCOUNT_ID"
          echo "========================================"

          echo "========================================"
          echo "AWS PRINCIPAL"
          echo "$PRINCIPAL_ARN"
          echo "========================================"


      # ========================================================
      # SETUP TERRAFORM
      # ========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ========================================================
      # TERRAFORM VERSION
      # ========================================================

      - name: Terraform Version
        run: |
          terraform version


      # ========================================================
      # TERRAFORM INIT
      #
      # IMPORTANT:
      # This must happen BEFORE terraform state list.
      # ========================================================

      - name: Terraform Init
        working-directory: terraform
        shell: bash
        run: |

          set -e

          echo "Initializing Terraform..."

          terraform init \
            -input=false \
            -reconfigure

          echo "Terraform initialization completed."


      # ========================================================
      # TERRAFORM STATE CHECK
      #
      # Do NOT use:
      # terraform state list | grep -q
      #
      # That caused the EPIPE error previously.
      # ========================================================

      - name: Check Terraform State
        working-directory: terraform
        shell: bash
        run: |

          set -e

          echo "Checking Terraform state..."

          if terraform state list > /tmp/terraform-state.txt 2>/dev/null; then

            echo "Terraform state exists."

            echo "========================================"
            echo "CURRENT TERRAFORM RESOURCES"
            echo "========================================"

            cat /tmp/terraform-state.txt

          else

            echo "No Terraform state found."

            touch /tmp/terraform-state.txt

          fi


      # ========================================================
      # IMPORT EXISTING EKS ADMIN ACCESS ENTRY
      # ========================================================

      - name: Import Existing EKS Admin Access Entry
        working-directory: terraform
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "CHECKING EKS ADMIN ACCESS ENTRY"
          echo "========================================"

          if grep -Fxq \
            "module.eks.aws_eks_access_entry.admin" \
            /tmp/terraform-state.txt; then

            echo "Admin access entry is already managed by Terraform."

          else

            echo "Admin access entry is NOT in Terraform state."

            echo "Checking whether EKS cluster exists..."

            if aws eks describe-cluster \
              --name "$CLUSTER_NAME" \
              --region "$AWS_REGION" \
              >/dev/null 2>&1; then

              echo "EKS cluster exists."

              ACCESS_ENTRY=$(aws eks list-access-entries \
                --cluster-name "$CLUSTER_NAME" \
                --region "$AWS_REGION" \
                --query "accessEntries[?@=='$PRINCIPAL_ARN'] | [0]" \
                --output text)

              echo "AWS access entry:"
              echo "$ACCESS_ENTRY"

              if [ "$ACCESS_ENTRY" = "$PRINCIPAL_ARN" ]; then

                echo "Existing access entry found."

                echo "Importing access entry..."

                terraform import \
                  "module.eks.aws_eks_access_entry.admin" \
                  "$CLUSTER_NAME:$PRINCIPAL_ARN"

                echo "Access entry imported successfully."

              else

                echo "Access entry does not exist."

                echo "Terraform will create it."

              fi

            else

              echo "EKS cluster does not exist."

              echo "Terraform will create the cluster."

            fi

          fi


      # ========================================================
      # IMPORT EXISTING EKS CLUSTER ADMIN POLICY
      # ========================================================

      - name: Import Existing EKS Cluster Admin Policy
        working-directory: terraform
        shell: bash
        run: |

          set -e

          POLICY_ARN="arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"

          echo "========================================"
          echo "CHECKING CLUSTER ADMIN POLICY"
          echo "========================================"

          if terraform state list > /tmp/terraform-state-current.txt 2>/dev/null; then
            :
          else
            touch /tmp/terraform-state-current.txt
          fi

          if grep -Fxq \
            "module.eks.aws_eks_access_policy_association.admin" \
            /tmp/terraform-state-current.txt; then

            echo "ClusterAdmin policy is already managed by Terraform."

          else

            if aws eks describe-cluster \
              --name "$CLUSTER_NAME" \
              --region "$AWS_REGION" \
              >/dev/null 2>&1; then

              echo "Checking AWS for ClusterAdmin policy..."

              POLICY_COUNT=$(aws eks list-associated-access-policies \
                --cluster-name "$CLUSTER_NAME" \
                --principal-arn "$PRINCIPAL_ARN" \
                --region "$AWS_REGION" \
                --query "associatedAccessPolicies[?policyArn=='$POLICY_ARN'] | length(@)" \
                --output text)

              echo "Policy count:"
              echo "$POLICY_COUNT"

              if [ "$POLICY_COUNT" = "1" ]; then

                echo "Existing ClusterAdmin policy found."

                echo "Importing policy association..."

                terraform import \
                  "module.eks.aws_eks_access_policy_association.admin" \
                  "$CLUSTER_NAME#$PRINCIPAL_ARN#$POLICY_ARN"

                echo "ClusterAdmin policy imported successfully."

              else

                echo "ClusterAdmin policy does not exist."

                echo "Terraform will create it."

              fi

            else

              echo "EKS cluster does not exist."

            fi

          fi


      # ========================================================
      # IMPORT EXISTING BANK NODE GROUP
      #
      # Terraform resource:
      # module.nodegroups.aws_eks_node_group.bank
      # ========================================================

      - name: Import Existing Bank Node Group
        working-directory: terraform
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "CHECKING BANK NODE GROUP"
          echo "========================================"

          if terraform state list > /tmp/terraform-state-bank.txt 2>/dev/null; then
            :
          else
            touch /tmp/terraform-state-bank.txt
          fi

          if grep -Fxq \
            "module.nodegroups.aws_eks_node_group.bank" \
            /tmp/terraform-state-bank.txt; then

            echo "bank-workers is already managed by Terraform."

          else

            if aws eks describe-nodegroup \
              --cluster-name "$CLUSTER_NAME" \
              --nodegroup-name "bank-workers" \
              --region "$AWS_REGION" \
              >/dev/null 2>&1; then

              echo "Existing bank-workers node group found."

              echo "Importing bank-workers..."

              terraform import \
                "module.nodegroups.aws_eks_node_group.bank" \
                "$CLUSTER_NAME:bank-workers"

              echo "bank-workers imported successfully."

            else

              echo "bank-workers does not exist."

              echo "Terraform will create bank-workers."

            fi

          fi


      # ========================================================
      # IMPORT EXISTING UPI NODE GROUP
      #
      # Terraform resource:
      # module.nodegroups.aws_eks_node_group.upi
      # ========================================================

      - name: Import Existing UPI Node Group
        working-directory: terraform
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "CHECKING UPI NODE GROUP"
          echo "========================================"

          if terraform state list > /tmp/terraform-state-upi.txt 2>/dev/null; then
            :
          else
            touch /tmp/terraform-state-upi.txt
          fi

          if grep -Fxq \
            "module.nodegroups.aws_eks_node_group.upi" \
            /tmp/terraform-state-upi.txt; then

            echo "upi-workers is already managed by Terraform."

          else

            if aws eks describe-nodegroup \
              --cluster-name "$CLUSTER_NAME" \
              --nodegroup-name "upi-workers" \
              --region "$AWS_REGION" \
              >/dev/null 2>&1; then

              echo "Existing upi-workers node group found."

              echo "Importing upi-workers..."

              terraform import \
                "module.nodegroups.aws_eks_node_group.upi" \
                "$CLUSTER_NAME:upi-workers"

              echo "upi-workers imported successfully."

            else

              echo "upi-workers does not exist."

              echo "Terraform will create upi-workers."

            fi

          fi


      # ========================================================
      # SHOW FINAL TERRAFORM STATE
      # ========================================================

      - name: Show Terraform State
        working-directory: terraform
        shell: bash
        run: |

          echo "========================================"
          echo "FINAL TERRAFORM STATE"
          echo "========================================"

          terraform state list || true


      # ========================================================
      # TERRAFORM FORMAT
      # ========================================================

      - name: Terraform Format Check
        working-directory: terraform
        shell: bash
        run: |

          terraform fmt -check -recursive


      # ========================================================
      # TERRAFORM VALIDATE
      # ========================================================

      - name: Terraform Validate
        working-directory: terraform
        shell: bash
        run: |

          terraform validate


      # ========================================================
      # TERRAFORM PLAN
      # ========================================================

      - name: Terraform Plan
        working-directory: terraform
        shell: bash
        run: |

          terraform plan \
            -input=false \
            -out=tfplan


      # ========================================================
      # TERRAFORM APPLY
      # ========================================================

      - name: Terraform Apply
        working-directory: terraform
        shell: bash
        run: |

          terraform apply \
            -input=false \
            -auto-approve \
            tfplan


      # ========================================================
      # VERIFY EKS CLUSTER
      # ========================================================

      - name: Verify EKS Cluster
        run: |

          echo "========================================"
          echo "EKS CLUSTER STATUS"
          echo "========================================"

          aws eks describe-cluster \
            --name "$CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query "cluster.status" \
            --output text


      # ========================================================
      # VERIFY BANK NODE GROUP
      # ========================================================

      - name: Verify Bank Node Group
        run: |

          echo "Checking bank-workers..."

          aws eks describe-nodegroup \
            --cluster-name "$CLUSTER_NAME" \
            --nodegroup-name "bank-workers" \
            --region "$AWS_REGION" \
            --query "nodegroup.status" \
            --output text


      # ========================================================
      # VERIFY UPI NODE GROUP
      # ========================================================

      - name: Verify UPI Node Group
        run: |

          echo "Checking upi-workers..."

          aws eks describe-nodegroup \
            --cluster-name "$CLUSTER_NAME" \
            --nodegroup-name "upi-workers" \
            --region "$AWS_REGION" \
            --query "nodegroup.status" \
            --output text


      # ========================================================
      # UPDATE KUBECONFIG
      # ========================================================

      - name: Update EKS Kubeconfig
        run: |

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME"


      # ========================================================
      # VERIFY KUBERNETES ACCESS
      # ========================================================

      - name: Verify Kubernetes Access
        run: |

          echo "========================================"
          echo "KUBERNETES CLUSTER"
          echo "========================================"

          kubectl cluster-info

          echo "========================================"
          echo "KUBERNETES NODES"
          echo "========================================"

          kubectl get nodes -o wide


  # ============================================================
  # BUILD + DEPLOY
  # ============================================================

  deploy:

    name: Build and Deploy APIs

    runs-on: ubuntu-latest

    needs:
      - terraform

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout Code
        uses: actions/checkout@v4


      # ========================================================
      # AWS CREDENTIALS
      # ========================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ========================================================
      # VERIFY AWS
      # ========================================================

      - name: Verify AWS Login
        run: |

          aws sts get-caller-identity


      # ========================================================
      # GET ACCOUNT ID
      # ========================================================

      - name: Get AWS Account ID
        run: |

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

          echo "AWS Account ID:"
          echo "$ACCOUNT_ID"


      # ========================================================
      # ECR LOGIN
      # ========================================================

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ========================================================
      # VERIFY BANK ECR
      # ========================================================

      - name: Verify Bank ECR Repository
        run: |

          aws ecr describe-repositories \
            --repository-names "$BANK_API_IMAGE" \
            --region "$AWS_REGION"


      # ========================================================
      # VERIFY UPI ECR
      # ========================================================

      - name: Verify UPI ECR Repository
        run: |

          aws ecr describe-repositories \
            --repository-names "$UPI_API_IMAGE" \
            --region "$AWS_REGION"


      # ========================================================
      # BUILD BANK API
      # ========================================================

      - name: Build Bank API Docker Image
        run: |

          docker build \
            -t "$BANK_API_IMAGE:${{ github.sha }}" \
            ./apps/bank-api


      # ========================================================
      # BUILD UPI API
      # ========================================================

      - name: Build UPI API Docker Image
        run: |

          docker build \
            -t "$UPI_API_IMAGE:${{ github.sha }}" \
            ./apps/upi-api


      # ========================================================
      # TAG BANK IMAGE
      # ========================================================

      - name: Tag Bank API Image
        run: |

          docker tag \
            "$BANK_API_IMAGE:${{ github.sha }}" \
            "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BANK_API_IMAGE:${{ github.sha }}"


      # ========================================================
      # TAG UPI IMAGE
      # ========================================================

      - name: Tag UPI API Image
        run: |

          docker tag \
            "$UPI_API_IMAGE:${{ github.sha }}" \
            "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$UPI_API_IMAGE:${{ github.sha }}"


      # ========================================================
      # PUSH BANK IMAGE
      # ========================================================

      - name: Push Bank API Image
        run: |

          docker push \
            "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BANK_API_IMAGE:${{ github.sha }}"


      # ========================================================
      # PUSH UPI IMAGE
      # ========================================================

      - name: Push UPI API Image
        run: |

          docker push \
            "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$UPI_API_IMAGE:${{ github.sha }}"


      # ========================================================
      # UPDATE KUBECONFIG
      # ========================================================

      - name: Update EKS Kubeconfig
        run: |

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME"


      # ========================================================
      # VERIFY NODES
      # ========================================================

      - name: Verify EKS Nodes
        run: |

          echo "========================================"
          echo "EKS NODES"
          echo "========================================"

          kubectl get nodes -o wide


      # ========================================================
      # CREATE/UPDATE BANK API
      # ========================================================

      - name: Apply Bank API Kubernetes Manifests
        run: |

          kubectl apply \
            -f kubernetes/bank-api/


      # ========================================================
      # CREATE/UPDATE UPI API
      # ========================================================

      - name: Apply UPI API Kubernetes Manifests
        run: |

          kubectl apply \
            -f kubernetes/upi-api/


      # ========================================================
      # UPDATE BANK IMAGE
      # ========================================================

      - name: Update Bank API Image
        run: |

          kubectl set image deployment/bank-api \
            bank-api="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BANK_API_IMAGE:${{ github.sha }}"


      # ========================================================
      # UPDATE UPI IMAGE
      # ========================================================

      - name: Update UPI API Image
        run: |

          kubectl set image deployment/upi-api \
            upi-api="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$UPI_API_IMAGE:${{ github.sha }}"


      # ========================================================
      # WAIT BANK ROLLOUT
      # ========================================================

      - name: Wait for Bank API Rollout
        run: |

          kubectl rollout status \
            deployment/bank-api \
            --timeout=180s


      # ========================================================
      # WAIT UPI ROLLOUT
      # ========================================================

      - name: Wait for UPI API Rollout
        run: |

          kubectl rollout status \
            deployment/upi-api \
            --timeout=180s


      # ========================================================
      # SHOW BANK PODS
      # ========================================================

      - name: Verify Bank API
        run: |

          kubectl get deployment bank-api

          kubectl get pods \
            -l app=bank-api \
            -o wide


      # ========================================================
      # SHOW UPI PODS
      # ========================================================

      - name: Verify UPI API
        run: |

          kubectl get deployment upi-api

          kubectl get pods \
            -l app=upi-api \
            -o wide


      # ========================================================
      # SHOW ALL RESOURCES
      # ========================================================

      - name: Show Kubernetes Resources
        run: |

          echo "========================================"
          echo "DEPLOYMENTS"
          echo "========================================"

          kubectl get deployments -A

          echo "========================================"
          echo "PODS"
          echo "========================================"

          kubectl get pods -A -o wide

          echo "========================================"
          echo "SERVICES"
          echo "========================================"

          kubectl get services -A


      # ========================================================
      # FINAL STATUS
      # ========================================================

      - name: Deployment Completed
        run: |

          echo "============================================"
          echo "EKS DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "============================================"

          echo "Cluster:"
          echo "$CLUSTER_NAME"

          echo "Region:"
          echo "$AWS_REGION"

          echo "Bank API:"
          echo "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BANK_API_IMAGE:${{ github.sha }}"

          echo "UPI API:"
          echo "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$UPI_API_IMAGE:${{ github.sha }}"

          echo "============================================"
