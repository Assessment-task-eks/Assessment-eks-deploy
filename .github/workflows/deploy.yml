name: EKS Infrastructure and Application

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose operation"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: assessment-eks

  ECR_BANK_REPO: bank-api
  ECR_UPI_REPO: upi-api

  K8S_NAMESPACE: default

jobs:

  # ==========================================================
  # DEPLOY
  # ==========================================================
  deploy:
    name: Deploy Infrastructure and Applications
    if: github.event.inputs.action == 'deploy'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: terraform

    steps:

      # ------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2. AWS CREDENTIALS
      # ------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------
      # 3. INSTALL TERRAFORM
      # ------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ------------------------------------------------------
      # 4. TERRAFORM VERSION
      # ------------------------------------------------------
      - name: Terraform version
        run: terraform version

      # ------------------------------------------------------
      # 5. TERRAFORM INIT
      # ------------------------------------------------------
      - name: Terraform Init
        run: terraform init -upgrade

      # ------------------------------------------------------
      # 6. TERRAFORM FORMAT
      # ------------------------------------------------------
      - name: Terraform Format
        run: terraform fmt -recursive

      # ------------------------------------------------------
      # 7. TERRAFORM VALIDATE
      # ------------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # ------------------------------------------------------
      # 8. IMPORT EXISTING EKS ACCESS ENTRY
      # ------------------------------------------------------
      - name: Import existing EKS Admin Access Entry
        shell: bash
        run: |
          set +e

          ACCESS_ENTRY_ARN="arn:aws:iam::033142159665:user/iac"

          echo "========================================"
          echo "CHECKING EKS ADMIN ACCESS ENTRY"
          echo "========================================"

          if terraform state list 2>/dev/null | grep -q '^module.eks.aws_eks_access_entry.admin$'; then
            echo "Access entry already managed by Terraform."
          else
            echo "Checking whether EKS cluster exists..."

            aws eks describe-cluster \
              --name "$CLUSTER_NAME" \
              --region "$AWS_REGION" >/dev/null 2>&1

            if [ $? -eq 0 ]; then

              echo "EKS cluster exists."

              EXISTING_ENTRY=$(aws eks list-access-entries \
                --cluster-name "$CLUSTER_NAME" \
                --region "$AWS_REGION" \
                --query "accessEntries[?@=='$ACCESS_ENTRY_ARN'] | [0]" \
                --output text)

              echo "AWS access entry:"
              echo "$ACCESS_ENTRY_ARN"

              if [ "$EXISTING_ENTRY" = "$ACCESS_ENTRY_ARN" ]; then

                echo "Existing access entry found."
                echo "Importing access entry..."

                terraform import \
                  'module.eks.aws_eks_access_entry.admin' \
                  "$CLUSTER_NAME:$ACCESS_ENTRY_ARN"

              else
                echo "Access entry does not exist."
              fi

            else
              echo "EKS cluster does not exist."
            fi
          fi

          set -e

      # ------------------------------------------------------
      # 9. IMPORT EXISTING NODE GROUPS
      # ------------------------------------------------------
      - name: Import existing EKS Node Groups
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "CHECKING EKS NODE GROUPS"
          echo "========================================"

          aws eks describe-cluster \
            --name "$CLUSTER_NAME" \
            --region "$AWS_REGION" >/dev/null 2>&1

          if [ $? -ne 0 ]; then
            echo "EKS cluster does not exist."
            exit 0
          fi

          # --------------------------------------------------
          # BANK NODE GROUP
          # --------------------------------------------------

          BANK_NG=$(aws eks list-nodegroups \
            --cluster-name "$CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query "nodegroups[?@=='bank-workers'] | [0]" \
            --output text)

          if terraform state list 2>/dev/null | \
             grep -q '^module.nodegroups.aws_eks_node_group.bank$'; then

            echo "bank-workers already managed by Terraform."

          elif [ "$BANK_NG" = "bank-workers" ]; then

            echo "Importing bank-workers..."

            terraform import \
              'module.nodegroups.aws_eks_node_group.bank' \
              "$CLUSTER_NAME:bank-workers"

          else

            echo "bank-workers does not exist."

          fi

          # --------------------------------------------------
          # UPI NODE GROUP
          # --------------------------------------------------

          UPI_NG=$(aws eks list-nodegroups \
            --cluster-name "$CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query "nodegroups[?@=='upi-workers'] | [0]" \
            --output text)

          if terraform state list 2>/dev/null | \
             grep -q '^module.nodegroups.aws_eks_node_group.upi$'; then

            echo "upi-workers already managed by Terraform."

          elif [ "$UPI_NG" = "upi-workers" ]; then

            echo "Importing upi-workers..."

            terraform import \
              'module.nodegroups.aws_eks_node_group.upi' \
              "$CLUSTER_NAME:upi-workers"

          else

            echo "upi-workers does not exist."

          fi

          set -e

      # ------------------------------------------------------
      # 10. TERRAFORM PLAN
      # ------------------------------------------------------
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # ------------------------------------------------------
      # 11. TERRAFORM APPLY
      # ------------------------------------------------------
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      # ------------------------------------------------------
      # 12. UPDATE KUBECONFIG
      # ------------------------------------------------------
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME"

      # ------------------------------------------------------
      # 13. VERIFY CLUSTER
      # ------------------------------------------------------
      - name: Verify EKS cluster
        run: |
          kubectl get nodes
          kubectl get pods -A
        working-directory: .

      # ------------------------------------------------------
      # 14. LOGIN TO ECR
      # ------------------------------------------------------
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region "$AWS_REGION" | \
          docker login \
            --username AWS \
            --password-stdin \
            "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      # ------------------------------------------------------
      # 15. BUILD BANK API
      # ------------------------------------------------------
      - name: Build Bank API image
        run: |
          docker build \
            -t "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_BANK_REPO}:${GITHUB_SHA}" \
            ./../bank-api

      # ------------------------------------------------------
      # 16. PUSH BANK API
      # ------------------------------------------------------
      - name: Push Bank API image
        run: |
          docker push \
            "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_BANK_REPO}:${GITHUB_SHA}"

      # ------------------------------------------------------
      # 17. BUILD UPI API
      # ------------------------------------------------------
      - name: Build UPI API image
        run: |
          docker build \
            -t "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_UPI_REPO}:${GITHUB_SHA}" \
            ./../upi-api

      # ------------------------------------------------------
      # 18. PUSH UPI API
      # ------------------------------------------------------
      - name: Push UPI API image
        run: |
          docker push \
            "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_UPI_REPO}:${GITHUB_SHA}"

      # ------------------------------------------------------
      # 19. CREATE KUBERNETES NAMESPACE
      # ------------------------------------------------------
      - name: Create namespace
        run: |
          kubectl create namespace "$K8S_NAMESPACE" \
            --dry-run=client \
            -o yaml | kubectl apply -f -
        working-directory: .

      # ------------------------------------------------------
      # 20. DEPLOY BANK API
      # ------------------------------------------------------
      - name: Deploy Bank API
        run: |
          kubectl apply -f ../kubernetes/bank-api-deployment.yaml
          kubectl apply -f ../kubernetes/bank-api-service.yaml
        working-directory: terraform

      # ------------------------------------------------------
      # 21. DEPLOY UPI API
      # ------------------------------------------------------
      - name: Deploy UPI API
        run: |
          kubectl apply -f ../kubernetes/upi-api-deployment.yaml
          kubectl apply -f ../kubernetes/upi-api-service.yaml
        working-directory: terraform

      # ------------------------------------------------------
      # 22. UPDATE IMAGE
      # ------------------------------------------------------
      - name: Update Bank API image
        run: |
          kubectl set image deployment/bank-api \
            bank-api="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_BANK_REPO}:${GITHUB_SHA}" \
            -n "$K8S_NAMESPACE"

      - name: Update UPI API image
        run: |
          kubectl set image deployment/upi-api \
            upi-api="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_UPI_REPO}:${GITHUB_SHA}" \
            -n "$K8S_NAMESPACE"

      # ------------------------------------------------------
      # 23. WAIT FOR DEPLOYMENT
      # ------------------------------------------------------
      - name: Wait for Bank API
        run: |
          kubectl rollout status \
            deployment/bank-api \
            -n "$K8S_NAMESPACE" \
            --timeout=5m

      - name: Wait for UPI API
        run: |
          kubectl rollout status \
            deployment/upi-api \
            -n "$K8S_NAMESPACE" \
            --timeout=5m

      # ------------------------------------------------------
      # 24. FINAL VERIFICATION
      # ------------------------------------------------------
      - name: Verify Kubernetes deployment
        run: |
          echo "========================================"
          echo "NODES"
          echo "========================================"

          kubectl get nodes -o wide

          echo "========================================"
          echo "PODS"
          echo "========================================"

          kubectl get pods -o wide

          echo "========================================"
          echo "DEPLOYMENTS"
          echo "========================================"

          kubectl get deployments

          echo "========================================"
          echo "SERVICES"
          echo "========================================"

          kubectl get services
        working-directory: .


  # ==========================================================
  # DESTROY
  # ==========================================================
  destroy:
    name: Destroy EKS Infrastructure
    if: github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: terraform

    steps:

      # ------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2. AWS CREDENTIALS
      # ------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------
      # 3. TERRAFORM
      # ------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ------------------------------------------------------
      # 4. TERRAFORM INIT
      # ------------------------------------------------------
      - name: Terraform Init
        run: terraform init -upgrade

      # ------------------------------------------------------
      # 5. CHECK STATE
      # ------------------------------------------------------
      - name: Check Terraform state
        run: |
          echo "========================================"
          echo "TERRAFORM STATE"
          echo "========================================"

          if [ -f terraform.tfstate ]; then
            terraform state list || true
          else
            echo "Local state file does not exist."
            echo "Terraform backend must be configured."
          fi

      # ------------------------------------------------------
      # 6. CONFIGURE KUBECTL IF CLUSTER EXISTS
      # ------------------------------------------------------
      - name: Configure kubectl
        shell: bash
        run: |
          set +e

          aws eks describe-cluster \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME" >/dev/null 2>&1

          if [ $? -eq 0 ]; then

            echo "EKS cluster exists."

            aws eks update-kubeconfig \
              --region "$AWS_REGION" \
              --name "$CLUSTER_NAME"

            echo "Kubernetes resources:"
            kubectl get all -A || true

          else

            echo "EKS cluster does not exist."

          fi

          set -e

      # ------------------------------------------------------
      # 7. DELETE KUBERNETES APPLICATIONS
      # ------------------------------------------------------
      - name: Delete Kubernetes applications
        shell: bash
        run: |
          set +e

          if kubectl cluster-info >/dev/null 2>&1; then

            echo "Deleting Bank API..."
            kubectl delete \
              -f ../kubernetes/bank-api-service.yaml \
              --ignore-not-found=true

            kubectl delete \
              -f ../kubernetes/bank-api-deployment.yaml \
              --ignore-not-found=true

            echo "Deleting UPI API..."
            kubectl delete \
              -f ../kubernetes/upi-api-service.yaml \
              --ignore-not-found=true

            kubectl delete \
              -f ../kubernetes/upi-api-deployment.yaml \
              --ignore-not-found=true

          else

            echo "Kubernetes cluster is not reachable."

          fi

          set -e

      # ------------------------------------------------------
      # 8. TERRAFORM DESTROY
      # ------------------------------------------------------
      - name: Terraform Destroy
        run: |
          terraform destroy -auto-approve

      # ------------------------------------------------------
      # 9. VERIFY
      # ------------------------------------------------------
      - name: Destroy verification
        shell: bash
        run: |
          echo "========================================"
          echo "DESTROY COMPLETED"
          echo "========================================"

          terraform state list || true
