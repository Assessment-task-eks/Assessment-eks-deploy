name: Terraform + Deploy APIs to EKS


on:
  push:
    branches:
      - main



env:

  AWS_REGION: ap-south-1

  CLUSTER_NAME: assessment-eks

  BANK_API_IMAGE: bank-api

  UPI_API_IMAGE: upi-api



permissions:

  contents: read



jobs:


# =====================================================
# Terraform Infrastructure
# =====================================================

  terraform:


    name: Terraform Apply


    runs-on: ubuntu-latest



    steps:


    - name: Checkout code
      uses: actions/checkout@v4

      with:
        fetch-depth: 2



    - name: Detect Terraform changes
      id: changes

      run: |

        if git diff --name-only HEAD^ HEAD | grep -q "^terraform/"; then

          echo "terraform=true" >> $GITHUB_OUTPUT

        else

          echo "terraform=false" >> $GITHUB_OUTPUT

        fi



    - name: Configure AWS credentials

      if: steps.changes.outputs.terraform == 'true'

      uses: aws-actions/configure-aws-credentials@v4

      with:

        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        aws-region: ${{ env.AWS_REGION }}



    - name: Verify AWS Login

      if: steps.changes.outputs.terraform == 'true'

      run: |

        aws sts get-caller-identity



    - name: Setup Terraform

      if: steps.changes.outputs.terraform == 'true'

      uses: hashicorp/setup-terraform@v3



    - name: Terraform Init

      if: steps.changes.outputs.terraform == 'true'

      working-directory: terraform

      run: |

        terraform init



    - name: Terraform Plan

      if: steps.changes.outputs.terraform == 'true'

      working-directory: terraform

      run: |

        terraform plan



    - name: Terraform Apply

      if: steps.changes.outputs.terraform == 'true'

      working-directory: terraform

      run: |

        terraform apply -auto-approve





# =====================================================
# Build Docker + Deploy EKS
# =====================================================


  deploy:


    name: Build Images and Deploy EKS


    runs-on: ubuntu-latest


    needs: terraform



    steps:



    - name: Checkout code

      uses: actions/checkout@v4





    - name: Configure AWS credentials

      uses: aws-actions/configure-aws-credentials@v4

      with:

        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        aws-region: ${{ env.AWS_REGION }}





    - name: Login to Amazon ECR

      uses: aws-actions/amazon-ecr-login@v2





    - name: Get AWS Account ID

      run: |

        echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV





# =====================================================
# Build Docker Images
# =====================================================


    - name: Build Bank API Image

      run: |

        docker build \

        -t $BANK_API_IMAGE:${{ github.sha }} \

        ./apps/bank-api





    - name: Build UPI API Image

      run: |

        docker build \

        -t $UPI_API_IMAGE:${{ github.sha }} \

        ./apps/upi-api





# =====================================================
# Push Images to ECR
# =====================================================


    - name: Push Bank API Image

      run: |


        docker tag \

        $BANK_API_IMAGE:${{ github.sha }} \

        $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BANK_API_IMAGE:${{ github.sha }}



        docker push \

        $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BANK_API_IMAGE:${{ github.sha }}







    - name: Push UPI API Image

      run: |


        docker tag \

        $UPI_API_IMAGE:${{ github.sha }} \

        $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$UPI_API_IMAGE:${{ github.sha }}



        docker push \

        $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$UPI_API_IMAGE:${{ github.sha }}






# =====================================================
# Connect EKS
# =====================================================


    - name: Update kubeconfig

      run: |


        aws eks update-kubeconfig \

        --region $AWS_REGION \

        --name $CLUSTER_NAME





# =====================================================
# Deploy Kubernetes
# =====================================================


    - name: Apply Kubernetes manifests

      run: |


        kubectl apply -f kubernetes/bank-api/

        kubectl apply -f kubernetes/upi-api/






# =====================================================
# Update Images
# =====================================================


    - name: Update Bank API Image

      run: |


        kubectl set image deployment/bank-api \

        bank-api=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BANK_API_IMAGE:${{ github.sha }}







    - name: Update UPI API Image

      run: |


        kubectl set image deployment/upi-api \

        upi-api=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$UPI_API_IMAGE:${{ github.sha }}






# =====================================================
# Verify Rollout
# =====================================================


    - name: Wait for Rollout

      run: |


        kubectl rollout status deployment/bank-api

        kubectl rollout status deployment/upi-api






    - name: Check Pods

      run: |


        kubectl get pods -A
